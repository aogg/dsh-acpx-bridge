# dsh-acpx-bridge bundle patch：由 plugin_manager install_bundle 读取。
# name 用包名（不是绝对路径），这样 profile 里解析到 node_modules 链接的包。
# 密钥只从环境变量注入，绝不写入本文件。
# baseURL 可用 ACPX_BRIDGE_BASE_URL 覆盖（不设置则用 config.js 里的默认端点）。
- insert:
    - id: acpx-bridge
      name: 'dsh-acpx-bridge'
      config:
        apiKey: !!js process.env.ACPX_BRIDGE_API_KEY ?? ''
        baseURL: !!js process.env.ACPX_BRIDGE_BASE_URL ?? ''
